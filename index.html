<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo TensorFlow.js</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #121212;
        }

        .card {
            border-radius: 12px;
        }

        h1, h2, h3, h4 {
            color: #ffffff;
        }

        p {
            color: #d1d1d1;
        }

        #estado {
            font-weight: bold;
            color: #00d4ff;
        }

        #resultado {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffc107;
        }

        input {
            background-color: #1e1e1e !important;
            color: white !important;
            border: 1px solid #555 !important;
        }

        input::placeholder {
            color: #aaa;
        }

        canvas {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>

<body class="bg-dark text-light">

<div class="container py-5">

    <!-- TÍTULO -->
    <div class="text-center mb-5">
        <h1 class="fw-bold">Entrenamiento modelo: y = 2x + 6</h1>
        <h3 class="text-info">y = 2x + 6</h3>
    </div>

    <!-- ENTRENAMIENTO -->
    <div class="card bg-secondary text-light mb-4 shadow">
        <div class="card-body text-center">

            <h4 class="card-title mb-3">Entrenamiento del modelo</h4>

            <button class="btn btn-info px-4" onclick="entrenar()">
                Entrenar modelo
            </button>

            <p id="estado" class="mt-3">
                Estado: esperando entrenamiento...
            </p>

        </div>
    </div>

    <!-- GRÁFICO -->
    <div class="card bg-secondary text-light mb-4 shadow">
        <div class="card-body">
            <h4 class="text-center">Evolución del error (Loss)</h4>
            <canvas id="graficoLoss"></canvas>
        </div>
    </div>

    <!-- PREDICCIÓN -->
    <div class="card bg-secondary text-light shadow">
        <div class="card-body text-center">

            <h2 class="card-title mb-3">Predicción</h2>

            <div class="row justify-content-center">
                <div class="col-md-4">

                    <input type="number" id="inputX"
                           class="form-control mb-3"
                           placeholder="Ingrese valor de X">

                    <button class="btn btn-success px-4" onclick="predecir()">
                        Predecir Y
                    </button>

                    <p id="resultado" class="mt-4 text-warning"></p>

                </div>
            </div>

        </div>
    </div>

</div>

<script>

let model;
let losses = [];
let chart;

// Crear gráfico UNA sola vez
function crearGrafico(){

    const ctx = document.getElementById("graficoLoss").getContext("2d");

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                label: "Loss",
                data: [],
                borderColor: "#00d4ff",
                backgroundColor: "rgba(0,212,255,0.1)",
                pointBackgroundColor: "#ffffff",
                borderWidth: 2,
                fill: false,
                tension: 0.2
            }]
        },
        options: {
            animation: {
                duration: 100,
                easing: 'linear'
            },
            plugins: {
                legend: {
                    labels: {
                        color: "#ffffff"
                    }
                }
            },
            responsive: true,
            scales: {
                x: {
                    ticks: { color: "#ffffff" },
                    title: {
                        display: true,
                        text: "Épocas",
                        color: "#ffffff"
                    }
                },
                y: {
                    ticks: { color: "#ffffff" },
                    title: {
                        display: true,
                        text: "Loss",
                        color: "#ffffff"
                    }
                }
            }
        }
    });
}

async function entrenar(){

    document.getElementById("estado").innerText = "Entrenando...";
    losses = [];

    crearGrafico();

    // Modelo
    model = tf.sequential();
    model.add(tf.layers.dense({
        units: 1,
        inputShape: [1]
    }));

    model.compile({
        loss: "meanSquaredError",
        optimizer: "sgd"
    });

    const xs = tf.tensor2d([-6,-5,-4,-3,-2,-1,0,1,2], [9,1]);
    const ys = tf.tensor2d([-6,-4,-2,0,2,4,6,8,10], [9,1]);

    await model.fit(xs, ys, {
        epochs: 350,
        callbacks:{
            onEpochEnd: (epoch, logs) => {

                losses.push(logs.loss);

                actualizarGrafico(epoch, logs.loss);

                console.log(`Epoch ${epoch}: loss = ${logs.loss}`);
            }
        }
    });

    document.getElementById("estado").innerHTML =
        "<span class='text-success'>✔ Entrenamiento completo. Modelo listo.</span>";
}

function actualizarGrafico(epoch, loss){

    chart.data.labels.push(epoch + 1);
    chart.data.datasets[0].data.push(loss);

    chart.update();
}

function predecir(){

    if (!model){
        alert("Primero entrene el modelo");
        return;
    }

    const x = parseFloat(document.getElementById("inputX").value);

    if (isNaN(x)){
        alert("Ingrese un número válido");
        return;
    }

    const resultado = model.predict(tf.tensor2d([x], [1, 1]));

    resultado.array().then(data => {
        document.getElementById("resultado").innerText =
            `Para X = ${x}, Y ≈ ${data[0][0].toFixed(2)}`;
    });
}

</script>

</body>
</html>
